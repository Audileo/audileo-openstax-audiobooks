name: "Audileo: Library Freshness Sync"

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: 

# Add this to stop older runs if a new one starts (prevents the "Canceled" mess)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: System Audit & Freshness Bump
        run: |
          git config user.name "audileo-bot"
          git config user.email "bot@audileo.com"
          
          git pull origin main --rebase --autostash
          
          echo "Last structural audit: $(date -u)" > .last-updated
          
          git add .last-updated
          if git diff --staged --quiet; then
            echo "No updates needed this week. Keeping existing heartbeat."
          else
            git commit -m "docs: automated library metadata sync [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
