name: Generate sitemap
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run it manually

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Generate the sitemap
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://audileo.github.io/audileo-openstax-audiobooks/
          additional-extensions: md # Crucial: tells the bot to include your .md files
          path-to-root: .

      - name: Commit and push
        run: |
          if [[ `git status --porcelain sitemap.xml` ]]; then
            git config --global user.name 'github-actions'
            git config --global user.email 'actions@github.com'
            git add sitemap.xml
            git commit -m "Automated sitemap update"
            git push
          fi
